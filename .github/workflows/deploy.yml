name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Static JSON mirror is the single source of truth (no D1, no quota).
      # Build it from /bible-sources/ first so the Worker (which reads the
      # static tree) and the consistency check see fresh data.
      - name: Build static JSON mirror
        run: python3 scripts/generate_static.py

      # Fail loudly if any /bible-sources/*.sqlite has no static mirror entry
      # (or a stale static tree has no source) — prevents silent discovery gaps.
      - name: Verify static mirror consistency
        run: python3 scripts/check_static_consistency.py

      - name: Deploy API worker
        working-directory: worker
        run: npx --yes wrangler@latest deploy

      # Cloudflare Pages caps a deployment at 20,000 files (free plan). The
      # full site tree (chapter JSON + chapter .m4a audio) exceeds that, so
      # audio deploys to a SEPARATE Pages project (versewell-audio) and the
      # main site proxies /static-data/*.m4a to it via site/_redirects (200).
      - name: Stage main site without audio
        run: |
          mkdir -p deploy-site
          rsync -a --exclude='*.m4a' --exclude='_headers.audio' site/ deploy-site/
          echo "main site file count: $(find deploy-site -type f | wc -l)"

      - name: Deploy reading site to Pages
        run: npx --yes wrangler@latest pages deploy deploy-site --project-name=versewell --branch=main
        env:
          CI: "true"

      - name: Stage audio-only tree
        run: |
          mkdir -p deploy-audio
          cd site
          find static-data -name '*.m4a' -print0 | cpio -pmd0 --quiet ../deploy-audio/
          cp _headers.audio ../deploy-audio/_headers
          echo "audio file count: $(find ../deploy-audio -type f -name '*.m4a' | wc -l)"

      - name: Deploy audio to Pages (versewell-audio project)
        run: npx --yes wrangler@latest pages deploy deploy-audio --project-name=versewell-audio --branch=main
        env:
          CI: "true"
