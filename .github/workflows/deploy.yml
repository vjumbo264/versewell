name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # D1 free tier allows ~100k row-writes/day; a full multi-version import is
  # ~300k rows and must span several days. This daily run resumes the import
  # automatically (apply_d1.py skips versions already fully imported and stops
  # gracefully when the day's quota is spent).
  schedule:
    - cron: "17 2 * * *"

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Import new/changed Bible versions into D1
        run: python3 scripts/apply_d1.py

      # Static JSON mirror is the source of truth; build it first so the Worker
      # (which reads the static tree) and the consistency check see fresh data.
      - name: Build static JSON mirror (quota-free)
        run: python3 scripts/generate_static.py

      # Fail loudly if any /bible-sources/*.sqlite has no static mirror entry
      # (or a stale static tree has no source) — prevents silent discovery gaps.
      - name: Verify static mirror consistency
        run: python3 scripts/check_static_consistency.py

      - name: Deploy API worker
        working-directory: worker
        run: npx --yes wrangler@latest deploy

      - name: Deploy reading site to Pages
        run: npx --yes wrangler@latest pages deploy site --project-name=versewell --branch=main
        env:
          CI: "true"
