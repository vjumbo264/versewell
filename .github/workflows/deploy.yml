name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Static JSON mirror is the single source of truth (no D1, no quota).
      # Build it from /bible-sources/ first so the Worker (which reads the
      # static tree) and the consistency check see fresh data.
      - name: Build static JSON mirror
        run: python3 scripts/generate_static.py

      # Fail loudly if any /bible-sources/*.sqlite has no static mirror entry
      # (or a stale static tree has no source) — prevents silent discovery gaps.
      - name: Verify static mirror consistency
        run: python3 scripts/check_static_consistency.py

      - name: Deploy API worker
        working-directory: worker
        run: npx --yes wrangler@latest deploy

      - name: Deploy reading site to Pages
        run: npx --yes wrangler@latest pages deploy site --project-name=versewell --branch=main
        env:
          CI: "true"
