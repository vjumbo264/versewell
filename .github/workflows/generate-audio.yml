name: "VerseWell Audio Generation Pipeline"

on:
  schedule:
    # Resume any incomplete translation every 2 hours
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      test_failure:
        description: 'Simulate a deliberate failure to verify CI turns red and nothing is published'
        type: boolean
        default: false
      pilot:
        description: 'Run isolated 2-chapter pilot verification'
        type: boolean
        default: false
      single_version:
        description: 'Run single version (kjv, niv, tlb, gw, voice, or all)'
        default: 'all'

permissions:
  contents: write
  actions: write

jobs:
  audio_matrix:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.single_version == '' || github.event.inputs.single_version == 'all' || github.event.inputs.single_version == matrix.version }}
    strategy:
      fail-fast: false
      matrix:
        version: [kjv, niv, tlb, gw, voice]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg, edge-tts, and offline Piper fallback
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python3 -m pip install --upgrade pip
          python3 -m pip install edge-tts aiohttp piper-tts

      - name: Check existing release & manifest
        if: ${{ github.event.inputs.pilot != 'true' && github.event.inputs.test_failure != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="audio-${{ matrix.version }}"
          mkdir -p "audio_${{ matrix.version }}" "/tmp/audio_out_${{ matrix.version }}"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download "$TAG" -p "manifest.json" -D "audio_${{ matrix.version }}" -R "$GITHUB_REPOSITORY" || true
            if [ -f "audio_${{ matrix.version }}/manifest.json" ]; then
              cp "audio_${{ matrix.version }}/manifest.json" "/tmp/audio_out_${{ matrix.version }}/manifest.json"
            fi
          else
            gh release create "$TAG" --title "VerseWell Audio - ${{ matrix.version }} (New Testament)" --notes "Verified NT audio narration assets for ${{ matrix.version }}" -R "$GITHUB_REPOSITORY"
          fi

      - name: Run Audio Generator
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          EXTRA_FLAGS=""
          if [ "${{ github.event.inputs.pilot }}" = "true" ]; then
            EXTRA_FLAGS="--pilot"
          fi
          if [ "${{ github.event.inputs.test_failure }}" = "true" ]; then
            EXTRA_FLAGS="--simulate-failure"
          fi
          python3 scripts/generate_audio.py --version "${{ matrix.version }}" $EXTRA_FLAGS

      - name: Self-Chain Continuation Run If Incomplete
        if: ${{ always() && github.event.inputs.pilot != 'true' && github.event.inputs.test_failure != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.AUDIO_RESUME_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          MANIFEST="/tmp/audio_out_${{ matrix.version }}/manifest.json"
          if [ -f "$MANIFEST" ]; then
            DONE=$(python3 -c "import json; m=json.load(open('$MANIFEST')); print(len(m.get('chapters', [])))")
            echo "Verified chapters for ${{ matrix.version }}: $DONE / 260"
            if [ "$DONE" -lt 260 ]; then
              echo "Dispatching continuation run for ${{ matrix.version }}..."
              gh workflow run generate-audio.yml -R "$GITHUB_REPOSITORY" -f single_version="${{ matrix.version }}" || true
            fi
          fi
