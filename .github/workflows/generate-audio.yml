name: generate-audio

# Chapter audio narration workflow (see AUDIO_STATE.json).
#
# Fully hands-free render-to-completion pipeline:
#   1. workflow_dispatch ONLY (audio synthesis is expensive/slow — never on push).
#   2. Each run is one ~5h slice. A watchdog creates a soft-stop file at the
#      5h00m mark so generation winds down, commits its last partial batch and
#      exits cleanly LONG BEFORE the 6h Actions hard kill — the previous
#      revision died at ~5h50m mid-job with NOTHING committed, losing the
#      entire run's work and leaving no next run dispatched.
#   3. INCREMENTAL PUBLISH: every N chapters (default 100) the generator
#      refreshes audio_url JSON, commits the new .m4a files and pushes. Every
#      push auto-triggers deploy.yml, so audio goes live AS IT RENDERS. A
#      crash loses at most one small batch, and re-runs skip committed files
#      (idempotent resume off the git tree itself — no separate state file).
#   4. PARALLEL: --jobs N concurrent Edge TTS workers (default 4).
#   5. AUTO-RESUME: if chapters remain unfinished when the slice ends, the
#      workflow re-dispatches ITSELF (workflow_dispatch with auto=1) via gh so
#      the next slice picks up exactly where this one stopped. Repeats until
#      every allowlisted chapter has audio. Requires the AUDIO_RESUME_TOKEN
#      secret (fine-grained PAT, actions:write); if absent the chain stops
#      with a warning and the operator re-triggers manually.
#   6. SELF-CLEANUP: when a resume-chain run (auto=1) finds 0 chapters
#      remaining, it finalizes (audio_url refresh), then git-rms this workflow
#      file and scripts/generate_audio.py, commits and pushes — all audio
#      GENERATION artifacts leave main. The rendered .m4a files and the
#      audio_url JSON fields the live site needs are kept. A manual dispatch
#      (auto != 1) NEVER self-deletes.
#   7. LOUD FAILURE (2026-09-15): if any chapter exhausts all retries, the
#      generator still commits + pushes every success (partial progress is
#      never lost) but then exits non-zero. A dedicated step appends an
#      aggregated per-chapter failure summary to the GitHub job summary, and
#      a final enforcement step marks the whole run FAILED. For days the
#      DavisNeural/NancyNeural backend retirement failed 2,378 chapters per
#      run behind a green 'success' — that can never happen silently again.
#      The auto-resume chain still re-dispatches, and because resume state
#      is the git tree, the next run retries exactly the failed chapters.
#
# Format: M4A (AAC) 48 kbps mono 24 kHz — ~1.9 MB per average chapter,
# ~4.5 GB total for the full 13.5k-chapter allowlist (inside GitHub's 5 GB
# repo soft cap and Cloudflare Pages' 25 MiB/file limit).

on:
  workflow_dispatch:
    inputs:
      versions:
        description: "Space-separated subset of allowlisted version codes (blank = all in scope)."
        required: false
        default: ""
      max_chapters:
        description: "Stop after N newly-generated chapters this run (blank = soft-stop at 5h00m)."
        required: false
        default: ""
      jobs:
        description: "Parallel synthesis workers (default 4)."
        required: false
        default: "4"
      auto:
        description: "1 = fired by the auto-resume chain (allows self-cleanup); manual runs leave this 0."
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: generate-audio
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.AUDIO_RESUME_TOKEN }}
  CLEANUP_ENABLED: ${{ inputs.auto == '1' }}
  # Soft-stop at 5h00m — far inside the 6h (360 min) job limit.
  SOFT_STOP_MINUTES: "300"

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1

      - name: Install edge-tts
        run: pip install edge-tts

      - name: Configure git identity
        run: |
          git config user.name  "versewell-audio-bot"
          git config user.email "versewell-audio-bot@users.noreply.github.com"

      # CRITICAL: pushes made with the default GITHUB_TOKEN do NOT trigger
      # other workflows, so batch commits would never fire deploy.yml and the
      # audio would sit in git without going live. Push with the PAT instead
      # (AUDIO_RESUME_TOKEN) so every incremental batch auto-deploys.
      - name: Use PAT for pushes so batch commits trigger deploy.yml
        if: env.GH_TOKEN != ''
        run: |
          echo "::add-mask::${{ secrets.AUDIO_RESUME_TOKEN }}"
          git remote set-url origin "https://x-access-token:${{ secrets.AUDIO_RESUME_TOKEN }}@github.com/${{ github.repository }}.git"

      # generate_static.py must run first so per-chapter JSON exists — the
      # audio script reads its verse text as the narration source.
      - name: Ensure static JSON mirror is fresh
        run: python3 scripts/generate_static.py

      - name: Plan — count chapters still needing audio
        id: plan
        run: |
          set -e
          ARGS=(--dry-run)
          if [ -n "${{ inputs.versions }}" ]; then
            ARGS+=(--versions ${{ inputs.versions }})
          fi
          OUT=$(python3 scripts/generate_audio.py "${ARGS[@]}")
          echo "$OUT"
          REMAINING=$(echo "$OUT" | sed -n 's/^remaining=\([0-9]*\).*/\1/p' | tail -1)
          REMAINING=${REMAINING:-0}
          echo "remaining=$REMAINING" >> "$GITHUB_OUTPUT"
          echo "Remaining chapters needing audio: $REMAINING"

      - name: Generate audio slice (parallel, incremental commit+push, soft-stop)
        id: gen
        if: steps.plan.outputs.remaining != '0'
        run: |
          STOP_FILE=/tmp/audio_soft_stop
          SUMMARY=/tmp/audio_summary.json
          rm -f "$STOP_FILE" "$SUMMARY"
          # Watchdog: touch the soft-stop file at the 5h00m mark so the
          # generator stops starting new chapters, drains in-flight work,
          # commits its final partial batch and exits 0 — well before the
          # 6h hard kill that used to wipe out entire runs.
          ( sleep $(( SOFT_STOP_MINUTES * 60 )); touch "$STOP_FILE" ) &
          WATCHDOG=$!
          ARGS=(--stop-file "$STOP_FILE" --jobs "${{ inputs.jobs }}" --summary-file "$SUMMARY")
          if [ -n "${{ inputs.versions }}" ]; then
            ARGS+=(--versions ${{ inputs.versions }})
          fi
          if [ -n "${{ inputs.max_chapters }}" ]; then
            ARGS+=(--max-chapters "${{ inputs.max_chapters }}")
          fi
          # The script itself refreshes audio_url JSON and commits + pushes
          # every --commit-interval successes (incremental publish). It now
          # exits NON-ZERO when any chapter exhausted its retries — do NOT
          # let that kill this step: the re-count, the aggregated failure
          # summary and the auto-resume dispatch below must still run. The
          # final 'Honest run status' step is what marks the run failed.
          python3 scripts/generate_audio.py "${ARGS[@]}" 2>&1 | tee /tmp/gen.log
          GEN_RC=${PIPESTATUS[0]}
          kill $WATCHDOG 2>/dev/null || true
          GEN=$(sed -n 's/^Done\. generated=\([0-9]*\).*/\1/p' /tmp/gen.log | tail -1)
          FAILED=$(sed -n 's/^Done\. generated=[0-9]* failed=\([0-9]*\).*/\1/p' /tmp/gen.log | tail -1)
          echo "generated=${GEN:-0}" >> "$GITHUB_OUTPUT"
          echo "failed=${FAILED:-0}" >> "$GITHUB_OUTPUT"
          echo "rc=${GEN_RC:-0}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Re-count remaining after this slice
        id: plan2
        run: |
          set -e
          git pull --rebase origin main || true
          ARGS=(--dry-run)
          if [ -n "${{ inputs.versions }}" ]; then
            ARGS+=(--versions ${{ inputs.versions }})
          fi
          OUT=$(python3 scripts/generate_audio.py "${ARGS[@]}")
          echo "$OUT"
          REMAINING=$(echo "$OUT" | sed -n 's/^remaining=\([0-9]*\).*/\1/p' | tail -1)
          REMAINING=${REMAINING:-0}
          echo "remaining=$REMAINING" >> "$GITHUB_OUTPUT"
          echo "Remaining after slice: $REMAINING"

      - name: Aggregated failure summary (job summary + log)
        if: always()
        run: |
          GENERATED="${{ steps.gen.outputs.generated }}"
          FAILED="${{ steps.gen.outputs.failed }}"
          REMAINING="${{ steps.plan2.outputs.remaining }}"
          GENERATED=${GENERATED:-0}; FAILED=${FAILED:-0}; REMAINING=${REMAINING:-0}
          {
            echo "## Audio generation — run summary"
            echo ""
            echo "| Metric | Value |"
            echo "| --- | --- |"
            echo "| Chapters generated this run | $GENERATED |"
            echo "| Chapters failed after all retries | $FAILED |"
            echo "| Chapters still remaining | $REMAINING |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$FAILED" != "0" ] && [ -f /tmp/audio_summary.json ]; then
            python3 - /tmp/audio_summary.json > /tmp/failures.md <<'PYEOF'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as fh:
              data = json.load(fh)
          for f in data.get("failures", []):
              print("- **{}** — {}".format(f["label"], f["reason"]))
          PYEOF
            {
              echo ""
              echo "### Failed chapters (each exhausted all retries)"
              echo ""
              echo "A re-run of this workflow retries exactly these chapters (git-tree resume); chapters already generated are skipped."
              echo ""
              cat /tmp/failures.md
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$FAILED chapter(s) failed all retries — aggregated list is in the job summary; a re-run retries exactly these chapters."
          elif [ "$FAILED" != "0" ]; then
            echo "::error::$FAILED chapter(s) failed all retries (summary file missing — see the FAILED lines in the generation log)."
          else
            echo "No chapter failures this run."
          fi

      - name: AUTO-RESUME — re-dispatch next slice
        if: steps.plan2.outputs.remaining != '0' && env.GH_TOKEN != ''
        run: |
          echo "Chapters remain (${{ steps.plan2.outputs.remaining }}); re-dispatching next slice."
          gh workflow run generate-audio.yml --ref main \
            -f versions="${{ inputs.versions }}" \
            -f max_chapters="${{ inputs.max_chapters }}" \
            -f jobs="${{ inputs.jobs }}" \
            -f auto="1"

      - name: AUTO-RESUME unavailable — no AUDIO_RESUME_TOKEN secret
        if: steps.plan2.outputs.remaining != '0' && env.GH_TOKEN == ''
        run: |
          echo "::warning::Chapters remain but AUDIO_RESUME_TOKEN secret is not set, so the run cannot auto-resume. Add that secret (actions:write) or re-trigger 'generate-audio' manually to continue."

      - name: SELF-CLEANUP — render complete, remove generation artifacts
        if: steps.plan2.outputs.remaining == '0' && env.CLEANUP_ENABLED == 'true'
        run: |
          set -e
          echo "All allowlisted chapters have audio. Finalizing + cleaning up generation artifacts."
          python3 scripts/generate_audio.py --finalize   # final audio_url refresh
          git rm -q .github/workflows/generate-audio.yml scripts/generate_audio.py
          git add -A site/static-data
          if git diff --cached --quiet; then
            echo "Nothing to clean."
            exit 0
          fi
          git commit -m "audio: render complete — remove generation workflow + script"
          git push origin HEAD:main
          echo "Self-cleanup pushed. Generation artifacts removed from main; rendered .m4a files and audio_url JSON stay."

      # LOUD-FAILURE enforcement — intentionally the LAST step. By this point
      # every success has been committed + pushed by the generator, the
      # aggregated failure list is in the job summary, and the auto-resume
      # chain has already dispatched the retry run. Only NOW do we turn the
      # run red so the failure cannot hide behind a green 'success'.
      - name: Honest run status — fail the run if any chapter failed
        if: always()
        run: |
          FAILED="${{ steps.gen.outputs.failed }}"
          RC="${{ steps.gen.outputs.rc }}"
          FAILED=${FAILED:-0}; RC=${RC:-0}
          if [ "$FAILED" != "0" ]; then
            echo "::error::Audio generation marked FAILED: $FAILED chapter(s) exhausted all retries. Partial progress was committed; the auto-resume chain (or a manual re-dispatch) retries exactly the failed chapters. See the job summary for the full list."
            exit 1
          fi
          if [ "$RC" != "0" ]; then
            echo "::error::Audio generation marked FAILED: generator exited with code $RC before completing (see the generation log above). Any committed progress is safe; re-run to resume."
            exit 1
          fi
          echo "No failed chapters and generator exited cleanly — run status stays green."
