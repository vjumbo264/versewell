name: "Data Contract Validation"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check static consistency
        run: python3 scripts/check_static_consistency.py
      - name: Validate data contract
        run: python3 scripts/validate_data_contract.py
